services:
  # PostgreSQL with pgvector for AI embeddings
  db:
    image: pgvector/pgvector:pg16
    container_name: pulsar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DPP_DATABASE_USER:-pulsar_user}
      POSTGRES_PASSWORD: ${DPP_DATABASE_PASSWORD:-pulsar_password}
      POSTGRES_DB: ${DPP_DATABASE_NAME:-pulsar_estate}
    ports:
      - "${DPP_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DPP_DATABASE_USER:-pulsar_user} -d ${DPP_DATABASE_NAME:-pulsar_estate}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulsar_network

  # RabbitMQ Message Broker for Celery
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulsar_rabbitmq
    restart: unless-stopped
    ports:
      - "${DPP_RABBITMQ_PORT:-5672}:5672"
      - "${DPP_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${DPP_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${DPP_RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pulsar_network

  # FastAPI Application (Production-Ready Configuration)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pulsar_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DPP_ENVIRONMENT=${DPP_ENVIRONMENT:-dev}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pulsar_network

volumes:
  postgres_data:

networks:
  pulsar_network:
    driver: bridge